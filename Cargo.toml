[package]
name = "onethu-harness"
version = "0.1.0"
edition = "2021"
description = "OneTHU Harness - Rust core agent plugin for OneTHU"
authors = ["smartThise"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "gzip"] }
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
