[package]
name = "onethu-harness-core"
version = "0.1.0"
edition = "2021"
description = "OneTHU Harness core —— agent 主控循环/工具集/LLM 客户端/会话与用量（宿主无关，可编进 App 或 stdio sidecar）"
authors = ["smartThise"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "gzip"] }
chrono = "0.4"
